<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Queen Lea | Model Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
      color: #5e461f;

      background:
        linear-gradient(
          rgba(255,255,255,.78),
          rgba(255,248,230,.86)
        ),
        url("lea-maine.png");

      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    header {
      padding: 45px 20px 20px;
    }

    .crown {
      font-size: 48px;
      color: #c48a2f;
    }

    h1 {
      font-size: clamp(50px, 9vw, 90px);
      color: #c48a2f;
      letter-spacing: 5px;
    }

    header h2 {
      margin-top: 8px;
      font-size: 18px;
      letter-spacing: 7px;
      font-weight: normal;
      color: #634d2a;
    }

    /* MAIN PICTURE */

    .main-photo {
      width: min(90%, 600px);
      margin: 35px auto 25px;
      border-radius: 28px;
      overflow: hidden;
      border: 4px solid #e5ca91;
      box-shadow: 0 15px 40px rgba(80,55,20,.22);
      cursor: pointer;
      position: relative;
      background: white;
    }

    .main-photo img {
      width: 100%;
      display: block;
    }

    .tap-message {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,.94);
      color: #9b6a20;
      padding: 11px 20px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 14px;
      white-space: nowrap;
    }

    /* INFO BOXES */

    .name-box,
    .model-info {
      width: min(90%, 650px);
      margin: 30px auto;
      padding: 32px 25px;
      border-radius: 27px;
      background: rgba(255,255,255,.88);
      border: 1px solid rgba(196,138,47,.30);
      box-shadow: 0 12px 30px rgba(80,55,20,.13);
    }

    .name-box h3 {
      font-size: 42px;
      color: #c48a2f;
      letter-spacing: 4px;
    }

    .name-box p {
      margin-top: 10px;
      letter-spacing: 3px;
    }

    .model-info h2 {
      color: #c48a2f;
      font-size: 32px;
      letter-spacing: 4px;
      margin-bottom: 20px;
    }

    .model-info p {
      font-size: 19px;
      margin: 11px 0;
    }

    /* PORTFOLIO */

    .portfolio {
      padding: 45px 18px 80px;
    }

    .portfolio h2 {
      color: #c48a2f;
      font-size: 38px;
      letter-spacing: 5px;
      margin-bottom: 35px;
    }

    .gallery {
      width: min(1050px, 95%);
      margin: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 22px;
    }

    .photo-card {
      padding: 9px;
      border-radius: 25px;
      background: rgba(255,255,255,.94);
      border: 3px solid #e6cc98;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(68,46,16,.18);
    }

    .photo-card img {
      width: 100%;
      height: 520px;
      object-fit: contain;
      display: block;
      border-radius: 18px;
      background: white;
    }

    /* YOUTUBE PLAYER IS HIDDEN */

    #player-holder {
      position: fixed;
      width: 2px;
      height: 2px;
      left: -9999px;
      bottom: 0;
      overflow: hidden;
    }

    footer {
      padding: 35px 20px 50px;
      background: rgba(255,255,255,.78);
      letter-spacing: 3px;
      color: #765c34;
    }

    @media (max-width: 700px) {

      body {
        background-attachment: scroll;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .photo-card img {
        height: auto;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="crown">♛</div>

    <h1>QUEEN LEA</h1>

    <h2>MODEL PORTFOLIO</h2>
  </header>


  <!-- CLICK THIS PICTURE -->

  <div class="main-photo" onclick="toggleMusic()">

    <img
      src="lea-maine.png"
      alt="Queen Lea"
    >

    <div class="tap-message" id="tapMessage">
      ▶ TAP LEA TO PLAY MUSIC
    </div>

  </div>


  <section class="name-box">

    <h3>LEA</h3>

    <p>
      CONFIDENT • ELEGANT • ELEVATED
    </p>

  </section>


  <section class="model-info">

    <h2>MODEL PROFILE</h2>

    <p>
      <strong>Name:</strong> Lea
    </p>

    <p>
      <strong>Height:</strong> 5'2"
    </p>

    <p>
      <strong>Weight:</strong> 100 lbs
    </p>

    <p>
      <strong>Hair:</strong> Black
    </p>

    <p>
      <strong>Eyes:</strong> Brown
    </p>

  </section>


  <section class="portfolio">

    <h2>THE PORTFOLIO</h2>


    <div class="gallery">

      <div class="photo-card">
        <img src="lea2.png" alt="Lea Photo 2">
      </div>


      <div class="photo-card">
        <img src="lea3.png" alt="Lea Photo 3">
      </div>


      <div class="photo-card">
        <img src="lea4.png" alt="Lea Photo 4">
      </div>


      <div class="photo-card">
        <img src="lea5.png" alt="Lea Photo 5">
      </div>

    </div>

  </section>


  <!-- YOUTUBE PLAYER -->

  <div id="player-holder">

    <div id="youtubePlayer"></div>

  </div>


  <footer>

    ♛ QUEEN LEA • MODEL PORTFOLIO ♛

  </footer>


  <!-- LOAD YOUTUBE API -->

  <script src="https://www.youtube.com/iframe_api"></script>


  <script>

    let player;

    let playerReady = false;

    let musicPlaying = false;

    let waitingToPlay = false;


    /* CREATE YOUTUBE PLAYER */

    function onYouTubeIframeAPIReady() {

      player = new YT.Player("youtubePlayer", {

        width: "2",

        height: "2",

        videoId: "vNBNIce9XDM",

        playerVars: {

          autoplay: 0,

          controls: 0,

          loop: 1,

          playlist: "vNBNIce9XDM",

          playsinline: 1

        },

        events: {

          onReady: function () {

            playerReady = true;

            /* If Lea was clicked while YouTube was loading */

            if (waitingToPlay) {

              startMusic();

            }

          }

        }

      });

    }


    /* CLICK LEA */

    function toggleMusic() {

      if (!playerReady) {

        waitingToPlay = true;

        document.getElementById("tapMessage").innerHTML =
          "♪ MUSIC LOADING...";

        return;

      }


      if (musicPlaying) {

        player.pauseVideo();

        musicPlaying = false;

        document.getElementById("tapMessage").innerHTML =
          "▶ TAP LEA TO PLAY MUSIC";

      }

      else {

        startMusic();

      }

    }


    /* START SONG */

    function startMusic() {

      waitingToPlay = false;

      player.unMute();

      player.setVolume(100);

      player.playVideo();

      musicPlaying = true;

      document.getElementById("tapMessage").innerHTML =
        "♪ MUSIC PLAYING";

    }

  </script>

</body>
</html>
