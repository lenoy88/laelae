<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Queen Lea | Model Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: #5f4823;
      text-align: center;

      /* LEA MAIN THRONE PHOTO AS BACKGROUND */
      background:
        linear-gradient(
          rgba(255,255,255,0.72),
          rgba(255,248,230,0.84)
        ),
        url("lea-maine.png");

      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    /* HEADER */

    header {
      padding: 45px 20px 20px;
    }

    .crown {
      font-size: 48px;
      color: #c68d2f;
      margin-bottom: 5px;
    }

    h1 {
      font-size: clamp(50px, 9vw, 90px);
      color: #c68d2f;
      letter-spacing: 5px;
      text-transform: uppercase;

      text-shadow:
        0 2px 4px white,
        0 5px 15px rgba(100,70,20,0.18);
    }

    header h2 {
      margin-top: 8px;
      font-size: 18px;
      letter-spacing: 7px;
      font-weight: normal;
      color: #634d2a;
    }

    /* MAIN PHOTO */

    .main-photo-box {
      width: min(90%, 580px);
      margin: 35px auto 20px;
      border-radius: 30px;
      overflow: hidden;
      border: 4px solid #e7cb91;

      box-shadow:
        0 16px 45px rgba(79,54,20,0.24);

      cursor: pointer;

      animation: mainPulse 3s ease-in-out infinite;

      position: relative;
      background: white;
    }

    .main-photo-box img {
      width: 100%;
      display: block;
    }

    @keyframes mainPulse {
      0%,100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.015);
      }
    }

    .play-message {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);

      width: max-content;
      max-width: 90%;

      padding: 11px 20px;

      border-radius: 30px;

      background: rgba(255,255,255,0.92);

      color: #a26b18;

      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1px;

      box-shadow:
        0 5px 15px rgba(0,0,0,0.15);
    }

    /* NAME SECTION */

    .name-section {
      width: min(90%, 650px);

      margin: 30px auto;

      padding: 30px 20px;

      border-radius: 28px;

      background:
        rgba(255,255,255,0.82);

      border:
        1px solid rgba(198,141,47,0.3);

      box-shadow:
        0 12px 30px rgba(92,62,20,0.15);

      backdrop-filter: blur(6px);
    }

    .name-section h3 {
      font-size: 45px;
      color: #c68d2f;
      letter-spacing: 5px;
    }

    .name-section p {
      margin-top: 10px;
      font-size: 16px;
      letter-spacing: 3px;
    }

    /* PROFILE */

    .model-profile {
      width: min(90%, 650px);

      margin: 35px auto;

      padding: 35px 25px;

      border-radius: 28px;

      background:
        rgba(255,255,255,0.88);

      border:
        1px solid rgba(198,141,47,0.3);

      box-shadow:
        0 12px 35px rgba(85,55,18,0.15);
    }

    .model-profile h2 {
      color: #c68d2f;
      font-size: 32px;
      letter-spacing: 4px;
      margin-bottom: 22px;
    }

    .model-profile p {
      font-size: 19px;
      margin: 12px 0;
    }

    .model-profile strong {
      color: #98671e;
    }

    /* PORTFOLIO */

    .portfolio {
      padding: 45px 18px 80px;
    }

    .portfolio-title {
      display: inline-block;

      margin-bottom: 35px;

      padding: 17px 32px;

      border-radius: 25px;

      background:
        rgba(255,255,255,0.86);

      box-shadow:
        0 8px 25px rgba(79,55,20,0.13);
    }

    .portfolio-title h2 {
      color: #c68d2f;
      font-size: 38px;
      letter-spacing: 5px;
    }

    .gallery {
      width: min(1050px, 95%);

      margin: auto;

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 22px;
    }

    .photo-card {
      padding: 9px;

      border-radius: 25px;

      background:
        rgba(255,255,255,0.93);

      border:
        3px solid #e6cc98;

      overflow: hidden;

      box-shadow:
        0 12px 30px rgba(68,46,16,0.18);

      animation:
        photoPulse 3.5s ease-in-out infinite;
    }

    .photo-card:nth-child(2) {
      animation-delay: .5s;
    }

    .photo-card:nth-child(3) {
      animation-delay: 1s;
    }

    .photo-card:nth-child(4) {
      animation-delay: 1.5s;
    }

    @keyframes photoPulse {
      0%,100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.02);
      }
    }

    .photo-card img {
      width: 100%;
      height: 520px;
      display: block;
      object-fit: contain;
      border-radius: 18px;
      background: white;
    }

    /* HIDDEN YOUTUBE PLAYER */

    #youtube-player {
      position: fixed;
      width: 2px;
      height: 2px;
      left: -9999px;
      bottom: 0;
      border: 0;
    }

    footer {
      padding: 35px 20px 50px;

      background:
        rgba(255,255,255,0.78);

      letter-spacing: 3px;

      color: #765c34;
    }

    /* PHONE */

    @media (max-width: 700px) {

      body {
        background-attachment: scroll;
        background-position: center top;
      }

      header {
        padding-top: 30px;
      }

      header h2 {
        font-size: 13px;
        letter-spacing: 5px;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .photo-card img {
        height: auto;
        max-height: 720px;
      }

      .portfolio-title h2 {
        font-size: 29px;
      }

      .name-section h3 {
        font-size: 37px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>

    <div class="crown">
      ♛
    </div>

    <h1>
      QUEEN LEA
    </h1>

    <h2>
      MODEL PORTFOLIO
    </h2>

  </header>


  <!-- MAIN PHOTO -->
  <!-- CLICK THIS PHOTO TO START / PAUSE MUSIC -->

  <section
    class="main-photo-box"
    onclick="toggleMusic()"
  >

    <img
      src="lea-maine.png"
      alt="Queen Lea"
    >

    <div
      class="play-message"
      id="playMessage"
    >
      ▶ TAP LEA TO PLAY MUSIC
    </div>

  </section>


  <!-- NAME -->

  <section class="name-section">

    <h3>
      LEA
    </h3>

    <p>
      CONFIDENT • ELEGANT • ELEVATED
    </p>

  </section>


  <!-- PROFILE -->

  <section class="model-profile">

    <h2>
      MODEL PROFILE
    </h2>

    <p>
      <strong>Name:</strong>
      Lea
    </p>

    <p>
      <strong>Height:</strong>
      5'2"
    </p>

    <p>
      <strong>Weight:</strong>
      100 lbs
    </p>

    <p>
      <strong>Hair:</strong>
      Black
    </p>

    <p>
      <strong>Eyes:</strong>
      Brown
    </p>

  </section>


  <!-- PORTFOLIO -->

  <section class="portfolio">

    <div class="portfolio-title">

      <h2>
        THE PORTFOLIO
      </h2>

    </div>


    <div class="gallery">

      <div class="photo-card">

        <img
          src="lea2.png"
          alt="Lea Model Photo 2"
        >

      </div>


      <div class="photo-card">

        <img
          src="lea3.png"
          alt="Lea Model Photo 3"
        >

      </div>


      <div class="photo-card">

        <img
          src="lea4.png"
          alt="Lea Model Photo 4"
        >

      </div>


      <div class="photo-card">

        <img
          src="lea5.png"
          alt="Lea Model Photo 5"
        >

      </div>

    </div>

  </section>


  <!-- YOUTUBE MUSIC -->

  <iframe
    id="youtube-player"
    src="https://www.youtube.com/embed/vNBNIce9XDM?enablejsapi=1&loop=1&playlist=vNBNIce9XDM&controls=0"
    title="Queen Lea Music"
    allow="autoplay; encrypted-media"
  ></iframe>


  <footer>

    ♛ QUEEN LEA • MODEL PORTFOLIO ♛

  </footer>


  <script>

    let musicPlaying = false;

    function toggleMusic() {

      const player =
        document.getElementById("youtube-player");

      const message =
        document.getElementById("playMessage");


      if (musicPlaying === false) {

        player.contentWindow.postMessage(
          JSON.stringify({
            event: "command",
            func: "playVideo",
            args: []
          }),
          "*"
        );

        musicPlaying = true;

        message.innerHTML =
          "❚❚ TAP LEA TO PAUSE MUSIC";

      }

      else {

        player.contentWindow.postMessage(
          JSON.stringify({
            event: "command",
            func: "pauseVideo",
            args: []
          }),
          "*"
        );

        musicPlaying = false;

        message.innerHTML =
          "▶ TAP LEA TO PLAY MUSIC";

      }

    }

  </script>

</body>
</html>
