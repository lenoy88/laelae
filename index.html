<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Queen Lea | Model Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top, #ffffff 0%, #fffaf0 35%, #f3e6c7 100%);
      color: #5e461f;
      min-height: 100vh;
      text-align: center;
    }

    header {
      padding: 45px 20px 20px;
    }

    .crown {
      font-size: 42px;
      margin-bottom: 5px;
    }

    h1 {
      font-size: clamp(48px, 9vw, 95px);
      letter-spacing: 4px;
      color: #c48a2f;
      text-transform: uppercase;
      text-shadow: 0 2px 8px rgba(196, 138, 47, 0.15);
    }

    header h2 {
      margin-top: 8px;
      font-size: 20px;
      letter-spacing: 8px;
      font-weight: normal;
      color: #6e5631;
    }

    .hero {
      width: min(92%, 600px);
      margin: 25px auto 0;
      border-radius: 28px;
      overflow: hidden;
      border: 4px solid #e7cf9f;
      box-shadow: 0 15px 45px rgba(98, 67, 25, 0.22);
      animation: softPulse 3.2s ease-in-out infinite;
      background: white;
    }

    .hero img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    @keyframes softPulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 15px 45px rgba(98, 67, 25, 0.22);
      }

      50% {
        transform: scale(1.015);
        box-shadow: 0 18px 55px rgba(196, 138, 47, 0.35);
      }
    }

    .main-label {
      margin: 32px auto 20px;
      padding: 10px;
    }

    .main-label h3 {
      font-size: 42px;
      color: #c48a2f;
      letter-spacing: 4px;
    }

    .main-label p {
      margin-top: 8px;
      font-size: 17px;
      letter-spacing: 3px;
      color: #694f28;
    }

    .divider {
      width: 170px;
      height: 2px;
      background: linear-gradient(to right, transparent, #c48a2f, transparent);
      margin: 25px auto;
    }

    .model-info {
      width: min(90%, 650px);
      margin: 25px auto;
      padding: 36px 25px;
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(196, 138, 47, 0.28);
      box-shadow: 0 12px 35px rgba(120, 86, 36, 0.12);
      backdrop-filter: blur(4px);
    }

    .model-info h2 {
      color: #c48a2f;
      font-size: 32px;
      letter-spacing: 3px;
      margin-bottom: 20px;
    }

    .stats p {
      font-size: 19px;
      margin: 11px 0;
      color: #5e461f;
    }

    .stats strong {
      color: #9c6d24;
    }

    .portfolio {
      padding: 40px 18px 70px;
    }

    .portfolio h2 {
      color: #c48a2f;
      font-size: 40px;
      letter-spacing: 4px;
      margin-bottom: 35px;
    }

    .gallery {
      width: min(1100px, 95%);
      margin: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .photo-card {
      overflow: hidden;
      border-radius: 24px;
      background: white;
      border: 3px solid #ead5aa;
      box-shadow: 0 12px 30px rgba(81, 57, 22, 0.18);
      animation: photoPulse 3.5s ease-in-out infinite;
    }

    .photo-card:nth-child(2) {
      animation-delay: 0.5s;
    }

    .photo-card:nth-child(3) {
      animation-delay: 1s;
    }

    .photo-card:nth-child(4) {
      animation-delay: 1.5s;
    }

    @keyframes photoPulse {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.025);
      }
    }

    .photo-card img {
      width: 100%;
      height: 520px;
      display: block;
      object-fit: contain;
      background: #fffdf8;
    }

    .music-controls {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 999;
    }

    .music-controls button {
      border: none;
      border-radius: 50px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(135deg, #e5c277, #b97b24);
      color: white;
      box-shadow: 0 8px 24px rgba(99, 64, 17, 0.3);
    }

    .music-controls button:hover {
      transform: scale(1.05);
    }

    #youtube-player {
      position: fixed;
      width: 1px;
      height: 1px;
      left: -9999px;
      bottom: 0;
      border: 0;
    }

    footer {
      padding: 35px 20px 90px;
      font-size: 14px;
      letter-spacing: 2px;
      color: #806943;
    }

    @media (max-width: 700px) {
      header {
        padding-top: 30px;
      }

      header h2 {
        font-size: 14px;
        letter-spacing: 5px;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .photo-card img {
        height: auto;
        max-height: 680px;
      }

      .portfolio h2 {
        font-size: 31px;
      }

      .main-label h3 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="crown">♛</div>
    <h1>Queen Lea</h1>
    <h2>MODEL PORTFOLIO</h2>
  </header>


  <!-- MAIN PHOTO -->
  <section class="hero">
    <img src="lea-maine.png" alt="Queen Lea">
  </section>


  <div class="main-label">
    <h3>LEA</h3>
    <p>CONFIDENT • ELEGANT • ELEVATED</p>
  </div>

  <div class="divider"></div>


  <!-- MODEL INFORMATION -->
  <section class="model-info">
    <h2>MODEL PROFILE</h2>

    <div class="stats">
      <p><strong>Name:</strong> Lea</p>
      <p><strong>Height:</strong> 5'0"</p>
      <p><strong>Weight:</strong> 100 lbs</p>
      <p><strong>Hair:</strong> Black</p>
      <p><strong>Eyes:</strong> Brown</p>
    </div>
  </section>


  <!-- PORTFOLIO -->
  <section class="portfolio">
    <h2>THE PORTFOLIO</h2>

    <div class="gallery">

      <div class="photo-card">
        <img src="lea2.png" alt="Lea Model Photo 2">
      </div>

      <div class="photo-card">
        <img src="lea3.png" alt="Lea Model Photo 3">
      </div>

      <div class="photo-card">
        <img src="lea4.png" alt="Lea Model Photo 4">
      </div>

      <div class="photo-card">
        <img src="lea5.png" alt="Lea Model Photo 5">
      </div>

    </div>
  </section>


  <!-- HIDDEN YOUTUBE MUSIC -->
  <iframe
    id="youtube-player"
    src="https://www.youtube.com/embed/vNBNIce9XDM?enablejsapi=1&loop=1&playlist=vNBNIce9XDM"
    allow="autoplay; encrypted-media"
    title="Queen Lea Music">
  </iframe>


  <!-- MUSIC BUTTON -->
  <div class="music-controls">
    <button id="musicButton" onclick="toggleMusic()">
      ▶ Play Music
    </button>
  </div>


  <footer>
    QUEEN LEA • MODEL PORTFOLIO
  </footer>


  <script>
    let musicPlaying = false;

    function toggleMusic() {
      const player = document.getElementById("youtube-player");
      const button = document.getElementById("musicButton");

      if (!musicPlaying) {
        player.contentWindow.postMessage(
          '{"event":"command","func":"playVideo","args":""}',
          '*'
        );

        button.innerHTML = "❚❚ Pause Music";
        musicPlaying = true;
      } else {
        player.contentWindow.postMessage(
          '{"event":"command","func":"pauseVideo","args":""}',
          '*'
        );

        button.innerHTML = "▶ Play Music";
        musicPlaying = false;
      }
    }
  </script>

</body>
</html>
