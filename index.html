<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Queen Lea | Model Portfolio</title>

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: #5e461f;
      text-align: center;
      min-height: 100vh;

      /* LEA THRONE PHOTO AS BACKGROUND */
      background:
        linear-gradient(
          rgba(255,255,255,0.78),
          rgba(255,248,230,0.84)
        ),
        url("lea-maine.png");

      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      padding: 55px 20px 30px;
    }

    .crown {
      font-size: 52px;
      color: #c48a2f;
      margin-bottom: 5px;
    }

    h1 {
      font-size: clamp(50px, 9vw, 95px);
      color: #c48a2f;
      letter-spacing: 5px;
      text-transform: uppercase;

      text-shadow:
        0 2px 5px white,
        0 4px 15px rgba(120,85,30,0.25);
    }

    header h2 {
      margin-top: 10px;
      font-size: 20px;
      letter-spacing: 8px;
      color: #624a27;
      font-weight: normal;
    }


    /* =========================
       QUEEN LEA INTRO
    ========================= */

    .queen-intro {

      width: min(90%, 700px);

      margin: 35px auto;

      padding: 45px 25px;

      background:
        rgba(255,255,255,0.78);

      border:
        2px solid rgba(196,138,47,0.35);

      border-radius: 30px;

      box-shadow:
        0 15px 40px rgba(87,62,24,0.18);

      backdrop-filter: blur(5px);
    }


    .mini-crown {
      font-size: 45px;
      color: #c48a2f;
    }


    .queen-intro h3 {

      font-size: 47px;

      color: #c48a2f;

      letter-spacing: 4px;

      margin-top: 10px;
    }


    .queen-intro p {

      margin-top: 12px;

      font-size: 17px;

      letter-spacing: 3px;

      color: #5d4827;
    }


    /* =========================
       GOLD DIVIDER
    ========================= */

    .divider {

      width: 180px;

      height: 2px;

      background:
        linear-gradient(
          to right,
          transparent,
          #c48a2f,
          transparent
        );

      margin: 30px auto;
    }


    /* =========================
       MODEL PROFILE
    ========================= */

    .model-info {

      width: min(90%, 650px);

      margin: 30px auto;

      padding: 40px 25px;

      border-radius: 28px;

      background:
        rgba(255,255,255,0.85);

      border:
        1px solid rgba(196,138,47,0.35);

      box-shadow:
        0 15px 40px rgba(90,60,20,0.16);

      backdrop-filter: blur(6px);
    }


    .model-info h2 {

      color: #c48a2f;

      font-size: 34px;

      letter-spacing: 4px;

      margin-bottom: 25px;
    }


    .stats p {

      font-size: 20px;

      margin: 12px 0;
    }


    .stats strong {

      color: #9d6b21;
    }


    /* =========================
       PORTFOLIO
    ========================= */

    .portfolio {

      padding: 50px 20px 90px;
    }


    .portfolio-title {

      display: inline-block;

      background:
        rgba(255,255,255,0.82);

      padding: 18px 35px;

      border-radius: 25px;

      margin-bottom: 35px;

      border:
        1px solid rgba(196,138,47,0.25);

      box-shadow:
        0 8px 25px rgba(80,55,20,0.12);
    }


    .portfolio h2 {

      color: #c48a2f;

      font-size: 42px;

      letter-spacing: 5px;
    }


    /* =========================
       PHOTO GALLERY
    ========================= */

    .gallery {

      width: min(1100px, 96%);

      margin: auto;

      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 24px;
    }


    .photo-card {

      background:
        rgba(255,255,255,0.90);

      padding: 10px;

      border-radius: 25px;

      border:
        3px solid #e4c98f;

      overflow: hidden;

      box-shadow:
        0 14px 35px rgba(70,48,18,0.20);

      animation:
        photoPulse 3.5s ease-in-out infinite;
    }


    .photo-card:nth-child(2) {
      animation-delay: 0.5s;
    }

    .photo-card:nth-child(3) {
      animation-delay: 1s;
    }

    .photo-card:nth-child(4) {
      animation-delay: 1.5s;
    }


    @keyframes photoPulse {

      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.025);
      }

    }


    .photo-card img {

      width: 100%;

      height: 540px;

      object-fit: contain;

      display: block;

      border-radius: 17px;

      background: white;
    }


    /* =========================
       MUSIC
    ========================= */

    #youtube-player {

      position: fixed;

      width: 1px;

      height: 1px;

      left: -9999px;

      bottom: 0;

      border: 0;

      opacity: 0;

      pointer-events: none;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {

      margin-top: 20px;

      padding: 35px 20px 55px;

      background:
        rgba(255,255,255,0.75);

      color: #80643b;

      letter-spacing: 3px;

      font-size: 14px;
    }


    /* =========================
       PHONE / MOBILE
    ========================= */

    @media(max-width:700px) {

      body {

        background-attachment: scroll;

        background-position: center top;
      }


      header {

        padding-top: 35px;
      }


      header h2 {

        font-size: 14px;

        letter-spacing: 5px;
      }


      .queen-intro h3 {

        font-size: 37px;
      }


      .gallery {

        grid-template-columns: 1fr;
      }


      .photo-card img {

        height: auto;

        max-height: 700px;
      }


      .portfolio h2 {

        font-size: 30px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <div class="crown">
      ♛
    </div>

    <h1>
      QUEEN LEA
    </h1>

    <h2>
      MODEL PORTFOLIO
    </h2>

  </header>



  <!-- =========================
       QUEEN LEA INTRO
  ========================== -->

  <section class="queen-intro">

    <div class="mini-crown">
      ♕
    </div>

    <h3>
      LEA
    </h3>

    <p>
      CONFIDENT • ELEGANT • ELEVATED
    </p>

  </section>



  <div class="divider"></div>



  <!-- =========================
       MODEL PROFILE
  ========================== -->

  <section class="model-info">

    <h2>
      MODEL PROFILE
    </h2>


    <div class="stats">

      <p>
        <strong>Name:</strong>
        Lea
      </p>


      <p>
        <strong>Height:</strong>
        5'2"
      </p>


      <p>
        <strong>Weight:</strong>
        100 lbs
      </p>


      <p>
        <strong>Hair:</strong>
        Black
      </p>


      <p>
        <strong>Eyes:</strong>
        Brown
      </p>

    </div>

  </section>



  <!-- =========================
       PORTFOLIO
  ========================== -->

  <section class="portfolio">


    <div class="portfolio-title">

      <h2>
        THE PORTFOLIO
      </h2>

    </div>



    <div class="gallery">


      <!-- PHOTO 2 -->

      <div class="photo-card">

        <img
          src="lea2.png"
          alt="Queen Lea Model Photo 2">

      </div>



      <!-- PHOTO 3 -->

      <div class="photo-card">

        <img
          src="lea3.png"
          alt="Queen Lea Model Photo 3">

      </div>



      <!-- PHOTO 4 -->

      <div class="photo-card">

        <img
          src="lea4.png"
          alt="Queen Lea Model Photo 4">

      </div>



      <!-- PHOTO 5 -->

      <div class="photo-card">

        <img
          src="lea5.png"
          alt="Queen Lea Model Photo 5">

      </div>


    </div>


  </section>



  <!-- =========================
       AUTOMATIC MUSIC
  ========================== -->

  <iframe

    id="youtube-player"

    src="https://www.youtube.com/embed/vNBNIce9XDM?autoplay=1&loop=1&playlist=vNBNIce9XDM&controls=0"

    title="Queen Lea Music"

    allow="autoplay; encrypted-media">

  </iframe>



  <!-- =========================
       FOOTER
  ========================== -->

  <footer>

    ♛ QUEEN LEA • MODEL PORTFOLIO ♛

  </footer>


</body>

</html>
